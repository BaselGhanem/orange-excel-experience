<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#374550" />
<title>CODERZ × Orange | Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--dark:#374550;--ink:#25313B;--blue:#147EEA;--orange:#FF7900;--green:#50BE87;--muted:#6B7782;--line:#E5EAF0;--bg:#F7F9FB;--white:#fff;--shadow:0 22px 70px rgba(37,49,59,.14)}*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 15% 12%,rgba(20,126,234,.14),transparent 28%),radial-gradient(circle at 85% 12%,rgba(255,121,0,.15),transparent 28%),var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(540px,100%)}.brand{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;margin-bottom:18px}.brand img:first-child{height:38px}.brand img:last-child{height:42px;max-width:88px}.brand span{font-weight:900;color:#9AA4AB}.card{background:#fff;border:1px solid var(--line);border-radius:30px;padding:28px;box-shadow:var(--shadow)}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#EEF6FE;color:var(--blue);font-size:11px;font-weight:900}.card h1{font-size:34px;margin:13px 0 6px}.card p{color:var(--muted);line-height:1.8;font-size:13px;margin:0 0 20px}.day{display:inline-flex;margin-bottom:18px;padding:8px 12px;border-radius:12px;background:#FFF2E6;color:#C86100;font-weight:900;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.field input{width:100%;height:49px;border:1px solid var(--line);border-radius:14px;padding:0 13px;font:inherit;outline:0}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(20,126,234,.08)}button{width:100%;height:52px;border:0;border-radius:15px;background:var(--orange);color:#fff;font:inherit;font-weight:900;cursor:pointer;margin-top:4px}.msg{text-align:center;font-size:12px;margin-top:13px;min-height:22px}.ok{color:#23835A}.err{color:#C43D3D}.closed{text-align:center;padding:22px 6px}.closed h2{margin:10px 0 6px}.home{display:inline-flex;margin-top:12px;color:var(--blue);font-weight:900;font-size:12px;text-decoration:none}@media(max-width:520px){body{padding:14px}.card{padding:21px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card h1{font-size:29px}}
</style>
</head>
<body>
<div class="shell">
<div class="brand" id="secretAdmin"><img src="https://coderz-tech.com/images/logo.png" alt="CODERZ"><span>×</span><img src="https://orange.jo/sites/default/files/2025-11/OJO-logo.svg" alt="Orange"></div>
<div class="card" id="card"><span class="badge">ATTENDANCE</span><h1>تسجيل الحضور</h1><p>اكتب اسمك والقسم، واضغط تسجيل الحضور.</p><div id="dayLabel" class="day">جاري التحميل...</div><div id="formWrap"><div class="grid"><div class="field"><label>الاسم الأول</label><input id="firstName" autocomplete="given-name"></div><div class="field"><label>اسم العائلة</label><input id="lastName" autocomplete="family-name"></div><div class="field full"><label>القسم / Department</label><input id="department" autocomplete="organization-title"></div></div><button id="submitBtn">تسجيل الحضور</button><div id="msg" class="msg"></div></div><div id="closed" class="closed" style="display:none"><h2>تسجيل الحضور غير مفتوح حالياً</h2><p>سيتم فتحه من قبل المدرب في بداية اليوم.</p><a class="home" href="../">العودة للموقع الرئيسي</a></div></div>
</div>
<script type="module">
const [appModule,firestoreModule]=await Promise.all([import(`https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js`)]);
const {initializeApp}=appModule;const {getFirestore,doc,getDoc,setDoc,serverTimestamp}=firestoreModule;
const firebaseConfig={apiKey:`AIzaSyDmkPioDg5ZewsX2ANM1hAqgVWyzLeezeU`,authDomain:`mobilehub-4eb1d.firebaseapp.com`,projectId:`mobilehub-4eb1d`,storageBucket:`mobilehub-4eb1d.firebasestorage.app`,messagingSenderId:`13420871425`,appId:`1:13420871425:web:e253fe9c5aebbc5925a500`,measurementId:`G-RYWYCQXBT8`};
const db=getFirestore(initializeApp(firebaseConfig));
const saved=JSON.parse(localStorage.getItem(`orangeExcelParticipant`)||`{}`);document.getElementById(`firstName`).value=saved.firstName||``;document.getElementById(`lastName`).value=saved.lastName||``;document.getElementById(`department`).value=saved.department||``;
let config={attendanceEnabled:false,attendanceDay:0};try{const snap=await getDoc(doc(db,`orangeExcelConfig`,`site`));if(snap.exists())config={...config,...snap.data()}}catch(error){console.error(error)}
const day=Number(config.attendanceDay||0);document.getElementById(`dayLabel`).textContent=day?`Day ${day} • Attendance`:`Attendance`;
if(!config.attendanceEnabled||![1,2,3].includes(day)){document.getElementById(`formWrap`).style.display=`none`;document.getElementById(`closed`).style.display=`block`}
const clean=(s)=>s.trim().replace(/\s+/g,` `);const keyify=(s)=>clean(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,`-`).replace(/^-|-$/g,``);
document.getElementById(`submitBtn`).addEventListener(`click`,async()=>{const firstName=clean(document.getElementById(`firstName`).value),lastName=clean(document.getElementById(`lastName`).value),department=clean(document.getElementById(`department`).value),msg=document.getElementById(`msg`);if(!firstName||!lastName||!department){msg.className=`msg err`;msg.textContent=`يرجى تعبئة الاسم والقسم.`;return}const fullName=`${firstName} ${lastName}`;const id=`day${day}-${keyify(fullName)}`;document.getElementById(`submitBtn`).disabled=true;try{await setDoc(doc(db,`orangeExcelAttendance`,id),{firstName,lastName,fullName,department,day,updatedAt:serverTimestamp()},{merge:true});localStorage.setItem(`orangeExcelParticipant`,JSON.stringify({firstName,lastName,department}));msg.className=`msg ok`;msg.textContent=`تم تسجيل حضورك لليوم ${day}.`;document.getElementById(`submitBtn`).textContent=`تم التسجيل`}catch(error){console.error(error);msg.className=`msg err`;msg.textContent=`تعذر تسجيل الحضور حالياً. حاول مرة أخرى.`;document.getElementById(`submitBtn`).disabled=false}});
let taps=0,timer;document.getElementById(`secretAdmin`).addEventListener(`click`,()=>{taps++;clearTimeout(timer);timer=setTimeout(()=>taps=0,1400);if(taps>=5)location.href=`../assessment/admin/`});
</script>
</body></html>
