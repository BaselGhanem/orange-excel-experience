<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07100f" />
  <meta name="description" content="A cinematic motion-learning platform for Excel formulas." />
  <title>Formula Motion — Cinematic Excel Learning</title>
  <link rel="stylesheet" href="./css/design-system.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="is-loading">
  <div class="experience-loader" id="experienceLoader" role="dialog" aria-modal="true" aria-label="Loading Formula Motion">
    <div class="loader-noise" aria-hidden="true"></div>
    <div class="loader-beam" aria-hidden="true"></div>
    <div class="loader-formulas" aria-hidden="true">
      <span>=SUMIFS()</span><span>=XLOOKUP()</span><span>=COUNTIFS()</span><span>=IF()</span><span>=FILTER()</span>
    </div>
    <div class="loader-core">
      <div class="loader-terminal" aria-hidden="true">
        <span class="loader-terminal__dot"></span>
        <span>FORMULA_MOTION.exe</span>
        <span class="loader-terminal__status" id="loaderStatus">BREACHING WORKBOOK…</span>
      </div>
      <div class="loader-geek" aria-hidden="true">
        <span class="loader-geek__glasses">⌐■_■</span>
        <span class="loader-geek__laugh">hehe.exe</span>
      </div>
      <h1 class="loader-title" dir="rtl">هكرنا الإكسل</h1>
      <p class="loader-copy">ACCESS GRANTED · FORMULAS UNLOCKED</p>
      <div class="loader-progress" aria-hidden="true"><span></span></div>
      <button class="loader-enter" id="loaderEnter" type="button" disabled>
        <span>ENTER THE LAB</span><span aria-hidden="true">→</span>
      </button>
    </div>
  </div>

  <div class="ambient" aria-hidden="true">
    <div class="ambient__orb ambient__orb--one"></div>
    <div class="ambient__orb ambient__orb--two"></div>
    <div class="ambient__grain"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="Formula Motion home">
      <span class="brand__mark">ƒx</span>
      <span class="brand__copy">
        <strong>FORMULA MOTION</strong>
        <small>VISUAL EXCEL LAB</small>
      </span>
    </a>

    <nav class="formula-nav" aria-label="Formula navigation">
      <div class="formula-picker" id="formulaPicker">
        <button class="formula-picker__trigger" id="formulaPickerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="formula-picker__meta">FORMULA</span>
          <strong id="formulaPickerValue">SUMIFS</strong>
          <span class="formula-picker__chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="formula-picker__menu" id="formulaPickerMenu" role="listbox" aria-label="Choose formula"></div>
      </div>

      <div class="mode-pill" id="modeIndicator" aria-live="polite">
        <span class="mode-pill__dot"></span>
        <span id="modeText">BASIC MODE</span>
      </div>

      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="Toggle motion sound effects">
        <span class="sound-toggle__icon" aria-hidden="true">◖</span>
        <span id="soundToggleText">SOUND ON</span>
      </button>
    </nav>
  </header>

  <main class="experience" id="experience">
    <section class="stage-shell" aria-label="Formula learning experience">
      <div class="stage-meta">
        <span class="stage-meta__eyebrow" id="stageEyebrow">EXCEL FORMULA · 01</span>
        <div class="stage-progress" aria-hidden="true"><span id="stageProgress"></span></div>
        <span class="stage-meta__scene" id="sceneCounter">01 / 08</span>
      </div>

      <div class="stage" id="stage" aria-live="polite">
        <div class="stage-pointer-glow" id="stagePointerGlow" aria-hidden="true"></div>
      </div>

      <div class="cinema-caption" id="cinemaCaption" aria-live="polite"></div>
    </section>
  </main>

  <footer class="control-deck" aria-label="Interactive motion controls">
    <button class="control control--ghost" id="prevFormula" type="button" aria-label="Previous formula">
      <span aria-hidden="true">←</span><span>Previous Formula</span>
    </button>

    <div class="director-controls" aria-label="Motion director controls">
      <button class="control control--utility" id="replayFormula" type="button" aria-label="Restart formula">
        <span class="control__icon" aria-hidden="true">↻</span><span class="director-hide-mobile">Restart</span>
      </button>
      <button class="control control--utility" id="stepBack" type="button" aria-label="Previous motion">
        <span aria-hidden="true">‹</span><span class="director-hide-mobile">Back</span>
      </button>
      <button class="control control--primary control--director" id="stepNext" type="button" aria-label="Trigger next motion">
        <span class="control-director__copy"><small id="motionCounter">01 / 01</small><strong id="stepNextLabel">Next Motion</strong></span>
        <span class="control-director__arrow" aria-hidden="true">→</span>
      </button>
    </div>

    <button class="control control--ghost" id="nextFormula" type="button" aria-label="Next formula">
      <span>Next Formula</span><span aria-hidden="true">→</span>
    </button>
  </footer>

  <div class="cursor-core" id="cursorCore" aria-hidden="true"></div>
  <div class="cursor-halo" id="cursorHalo" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><div class="noscript">This learning experience requires JavaScript.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
